[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasync"
version = "0.1.0"
description = "rsync-style file sync engine"
requires-python = ">=3.12"
dependencies = ["xxhash>=3.4"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100"]

[project.scripts]
deltasync = "deltasync.client.cli:main"

[tool.setuptools.packages.find]
include = ["deltasync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

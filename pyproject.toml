[build-system]
requires = ["setuptools>=69", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasync"
version = "0.1.0"
description = "rsync-style file sync engine"
requires-python = ">=3.12"
dependencies = ["xxhash>=3.4", "prometheus_client>=0.20", "flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100"]
bench = ["matplotlib>=3.8"]

[project.scripts]
deltasync = "deltasync.client.cli:main"

[tool.setuptools.packages.find]
include = ["deltasync*"]

[tool.setuptools.package-data]
deltasync = ["native_src/*.hpp", "native_src/*.h", "native_src/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
